<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>慢速英语播客 · 视频 Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>慢速英语播客 · 视频 Demo</h1>
    <p>纯静态页面，无需服务器。可直接生成语音（EdgeTTS / 浏览器语音）当人声，打开即默认带上当前一集素材，实时预览，播放并录制视频</p>
  </header>

  <main>
    <section class="controls">
      <div class="field tts" id="ttsPanel">
        <label class="tts-title">语音合成 → 生成人声</label>

        <div class="row">
          <select id="ttsEngine" title="合成引擎">
            <option value="edge">EdgeTTS · 微软在线音色（直连接口）</option>
            <option value="browser">浏览器语音 · 本机合成</option>
          </select>
        </div>
        <div class="hint" id="ttsEngineHint"></div>

        <label class="sub">合成文本</label>
        <textarea id="ttsText" rows="4">This is how you build your English brain. Listen every day, and speak a little every day.</textarea>

        <label class="sub">音色</label>
        <div class="filerow">
          <select id="ttsVoice"></select>
          <button class="clear" id="ttsVoiceRefresh" title="重新加载音色列表">↻</button>
        </div>
        <input type="text" id="ttsVoiceSearch" placeholder="搜索音色：zh-CN / Xiaoxiao / Female …">

        <div class="row slider">
          <span class="pkey">语速</span>
          <input type="range" id="ttsRate" min="-50" max="100" step="5" value="0">
          <span id="ttsRateVal">+0%</span>
        </div>
        <div class="row slider">
          <span class="pkey">音调</span>
          <input type="range" id="ttsPitch" min="-20" max="20" step="1" value="0">
          <span id="ttsPitchVal">+0Hz</span>
        </div>
        <div class="row slider">
          <span class="pkey">音量</span>
          <input type="range" id="ttsVolume" min="-50" max="50" step="5" value="0">
          <span id="ttsVolumeVal">+0%</span>
        </div>

        <div class="row" id="ttsFormatRow">
          <span class="pkey">格式</span>
          <select id="ttsFormat">
            <option value="mp3_48">MP3 · 24kHz 48kbps（默认）</option>
            <option value="mp3_96">MP3 · 24kHz 96kbps</option>
            <option value="wav">WAV · 24kHz 16bit</option>
            <option value="webm">WebM · Opus 24kHz</option>
          </select>
        </div>

        <details id="ttsAdvanced">
          <summary>高级设置（中转代理 / 校验）</summary>
          <div class="row">
            <input type="text" id="ttsProxy" placeholder="中转代理地址（可选）https://…workers.dev">
          </div>
          <div class="hint">直连被拒（403）时使用：自建 WS 中转后填入地址即可，见 README。留空 = 直连微软。</div>
          <div class="row">
            <button id="ttsSelfTest">自检连接</button>
            <span class="hint" id="ttsSelfTestResult"></span>
          </div>
        </details>

        <div class="actions tts-actions">
          <button id="ttsPreview">▶ 试听</button>
          <button id="ttsStop">■ 停止</button>
          <button id="ttsGenerate" class="primary">⚡ 生成并载入人声</button>
        </div>
        <div class="actions tts-actions">
          <button id="ttsDownload" disabled>↓ 下载音频</button>
          <button id="ttsSrt" disabled>↓ 导出 SRT</button>
          <button id="ttsCapture" hidden>⏺ 录制为音频</button>
        </div>

        <div class="tts-loading" id="ttsLoading" hidden>
          <div class="spinner"></div>
          <span id="ttsLoadingText">处理中…</span>
        </div>
        <div id="ttsStatus">选择引擎和音色，输入文本即可合成</div>
      </div>

      <div class="field">
        <label>人声录音</label>
        <div class="filerow">
          <button data-file="voice">选择音频…</button>
          <span class="fname" id="voiceName">未选择</span>
          <button class="clear" data-clear="voice" title="清除">×</button>
        </div>
      </div>

      <div class="field">
        <label>背景音乐 BGM</label>
        <div class="filerow">
          <button data-file="bgm">选择音频…</button>
          <span class="fname" id="bgmName">无 BGM</span>
          <button class="clear" data-clear="bgm" title="清除">×</button>
        </div>
      </div>

      <div class="field">
        <label>左下角图片</label>
        <div class="filerow">
          <button data-file="imgLeft">选择图片…</button>
          <span class="fname" id="imgLeftName">未选择</span>
          <button class="clear" data-clear="imgLeft" title="清除">×</button>
        </div>
        <div class="row slider">
          <input type="range" id="imgLeftH" min="100" max="800" step="10" value="580">
          <span id="imgLeftHVal">580px</span>
        </div>
      </div>

      <div class="field">
        <label>正文字体（英 / 中）</label>
        <div class="filerow">
          <button data-file="fontMain">选择字体文件…</button>
          <select id="fontMain"></select>
        </div>
        <label class="sub">标语字体</label>
        <div class="filerow">
          <button data-file="fontTag">选择字体文件…</button>
          <select id="fontTag"></select>
        </div>
      </div>

      <div class="field">
        <label>字幕 SRT（可选，带时间轴）</label>
        <div class="filerow">
          <button data-file="srt">选择 SRT…</button>
          <span class="fname" id="srtName">未选择（用下方演示文本）</span>
          <button class="clear" data-clear="srt" title="清除">×</button>
        </div>
      </div>

      <div class="field">
        <label>演示字幕文本（无 SRT 时显示）</label>
        <input type="text" id="enText" value="This is how you build your English brain.">
        <input type="text" id="zhText" value="这就是建立你“英语脑”的方式">
      </div>

      <div class="field">
        <label>录制时长（秒，0 = 整段）</label>
        <div class="row">
          <input type="number" id="recSeconds" value="10" min="0" step="1">
          <span class="hint" id="recHint">录制为实时进行</span>
        </div>
      </div>

      <div class="actions">
        <button id="btnPlay" class="primary">▶ 播放</button>
        <button id="btnStop">■ 停止</button>
        <button id="btnRecord">● 录制视频</button>
      </div>

      <div id="status">就绪</div>
      <div class="progress"><div id="bar"></div></div>
    </section>

    <section class="stage">
      <div class="panel">
        <h2>版式预览（1920×1080）</h2>
        <canvas id="canvas" width="1920" height="1080"></canvas>
      </div>
      <div class="panel">
        <h2>视频</h2>
        <video id="player" controls playsinline></video>
        <p class="links"><a id="download" download="slow_english_demo.webm" hidden>下载录制的视频</a></p>
      </div>
    </section>
  </main>

  <input type="file" id="fileInput" hidden>
  <script src="app.js"></script>
  <script src="voices.js"></script>
  <script src="edge-tts.js"></script>
  <script src="tts.js"></script>
</body>
</html>
